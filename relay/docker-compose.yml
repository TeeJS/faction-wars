# The schmitz-wars relay on the Unraid box (docs/m3-plan.md section 5).
#   docker compose up -d
# Then an NPM Plus proxy host: wars.schmitzplex.com -> http://wars-relay:8787,
# Websockets Support ON, SSL like the others, no Authelia on this host.
services:
  wars-relay:
    image: ghcr.io/teejs/wars-relay:latest
    container_name: wars-relay
    volumes:
      - ./data:/data
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - proxy                  # the network NPM Plus is on
networks:
  proxy:
    external: true
