# Builds the relay image with the exported web game inside and publishes it to
# GHCR as ghcr.io/<owner>/wars-relay:latest (and :<sha>) on every push to main.
# The Unraid template (relay/unraid/my-wars-relay.xml) pulls :latest.
name: relay image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time, the newest winning: a push cancels the run still going.
# Two merges seconds apart (#207, #208 on 2026-09-25) started two runs, the
# older finished 15 s after the newer and pushed its image over :latest - the
# Command Center frame vanished from the web game.
concurrency:
  group: relay-image
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The original game's artwork is never published (docs/original-art-plan.md):
      # players import their own art set. Nothing of it may be in the repo.
      - name: No original artwork in the repo
        run: |
          set -e
          leaked=$(git ls-files 'art/*' 'packs/*/original/*' | head -20)
          if [ -n "$leaked" ]; then
            echo "::error::The original's artwork is committed - it must never be published:"
            echo "$leaked"
            exit 1
          fi

      - name: Godot ${{ env.GODOT_VERSION }} and the web export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"
          ./godot --version

      - name: Export the web game (the Web preset in export_presets.cfg)
        run: |
          set -e
          # The build stamp the game shows (BuildInfo): utc date + short commit.
          echo "$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" > version.txt
          cat version.txt
          ./godot --headless --path . --import || true
          mkdir -p build/web
          ./godot --headless --path . --export-release Web build/web/index.html
          ls -la build/web
          test -s build/web/index.wasm && test -s build/web/index.pck && test -s build/web/index.html
          # ...nor in the exported game: no art-set or original/ path in the pck.
          if grep -a -q -E 'art/swr-original/|/original/(portraits|windows|tabs|buttons)/' build/web/index.pck; then
            echo "::error::The web export carries the original's artwork."
            exit 1
          fi

      - name: Image name (lower-case owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wars-relay" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          # unraid-image-publishing skill: a single-platform buildx push emits a
          # bare OCI manifest, which Unraid's update check cannot read; force the
          # Docker v2 media type and drop the attestation manifests.
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The faction-wars relay with the web game baked in
